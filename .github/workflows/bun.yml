name: PDF to Markdown

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Direct PDF download URL"
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MarkItDown
        run: |
          python -m pip install --upgrade pip
          pip install "markitdown[pdf]"

      - name: Download PDF
        run: |
          curl -L --fail "${{ github.event.inputs.pdf_url }}" -o input.pdf
          ls -lh input.pdf

      - name: Convert to Markdown
        run: |
          mkdir -p output
          markitdown input.pdf > output/document.md

      - name: Upload Markdown
        uses: actions/upload-artifact@v4
        with:
          name: markdown
          path: output/

      - name: Upload Original PDF
        uses: actions/upload-artifact@v4
        with:
          name: original-pdf
          path: input.pdf
