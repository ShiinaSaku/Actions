name: Bun Android (aarch64) — build latest

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun (latest main)
        uses: actions/checkout@v7
        with:
          repository: oven-sh/bun
          ref: main
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl wget lsb-release software-properties-common \
            cmake git golang libtool ninja-build pkg-config \
            ruby-full xz-utils perl ccache unzip

      - name: Install LLVM/Clang 21
        run: |
          wget https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install host Bun
        run: |
          curl -fsSL https://bun.com/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28b

      - name: bun install
        run: bun install

      - name: Pre-link NDK compiler-rt/libunwind into system LLVM (avoid EACCES at link time)
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          RT_SRC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/21/lib/linux"
          sudo mkdir -p \
            "/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android28" \
            "/usr/lib/llvm-21/lib/clang/21/lib/linux/aarch64"
          sudo ln -sf "$RT_SRC/libclang_rt.builtins-aarch64-android.a" \
            "/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android28/libclang_rt.builtins.a"
          sudo ln -sf "$RT_SRC/aarch64/libunwind.a" \
            "/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android28/libunwind.a"
          sudo ln -sf "$RT_SRC/libclang_rt.builtins-aarch64-android.a" \
            "/usr/lib/llvm-21/lib/clang/21/lib/linux/libclang_rt.builtins-aarch64-android.a"
          sudo ln -sf "$RT_SRC/aarch64/libunwind.a" \
            "/usr/lib/llvm-21/lib/clang/21/lib/linux/aarch64/libunwind.a"

      - name: Build (android/aarch64, best-effort inbuilt config)
        id: build
        continue-on-error: true
        run: |
          bun scripts/build.ts \
            --profile=release \
            --abi=android \
            --arch=aarch64 \
            --androidNdk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Upload everything build produced (binary, ninja file, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-aarch64
          path: |
            build/*/bun*
            build/*/build.ninja
            build/*/configure.json
            build/*/*.log
            build/*/ccache.log
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
        
      - name: Install host Bun
        run: |
          curl -fsSL https://bun.com/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - name: bun install
        run: bun install

      - name: Build (android/aarch64, best-effort inbuilt config)
        id: build
        continue-on-error: true
        run: |
          bun scripts/build.ts \
            --profile=release \
            --abi=android \
            --arch=aarch64 \
            --androidNdk="${{ steps.ndk.outputs.ndk-path }}" \
            --androidApiLevel=24

      - name: Upload everything build produced (binary, ninja file, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-android-aarch64
          path: |
            build/*/bun*
            build/*/build.ninja
            build/*/configure.json
            build/*/*.log
            build/*/ccache.log
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
        
