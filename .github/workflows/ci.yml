name: Build Android ARM64 Rust Tools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Build tools for Android ARM64
        run: |
          mkdir -p out/bin

          cargo zigbuild \
            --release \
            --target aarch64-linux-android \
            --package watchexec-cli || true

          cargo install watchexec-cli \
            --target aarch64-linux-android \
            --root ./out \
            --locked

          cargo install cargo-insta \
            --target aarch64-linux-android \
            --root ./out \
            --locked

          cargo install typos-cli \
            --target aarch64-linux-android \
            --root ./out \
            --locked

          cargo install cargo-shear \
            --target aarch64-linux-android \
            --root ./out \
            --locked

          cargo install dprint \
            --target aarch64-linux-android \
            --root ./out \
            --locked

          cargo install taplo-cli \
            --target aarch64-linux-android \
            --root ./out \
            --locked

      - name: Strip binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

          find out/bin -type f -exec llvm-strip {} \;

      - name: Archive binaries
        run: |
          cd out
          tar -czf rust-tools-aarch64-android.tar.gz bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-tools-aarch64-android
          path: out/rust-tools-aarch64-android.tar.gz
