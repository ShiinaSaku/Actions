name: Build Windows ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v7
        with:
          repository: shiinasaku/hayate

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: hayate-windows-arm64
          path: target/release/hayate.exe
